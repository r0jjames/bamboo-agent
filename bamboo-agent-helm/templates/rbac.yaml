apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bamboo-agent-kaniko
  namespace: {{ .Values.rbac.namespace }}
  labels:
    {{- include "bamboo-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # build-image.sh preflights that the Docker Hub push secret exists before it
  # templates the kaniko Job. Scoped to that one secret (least privilege); the
  # kaniko pod itself mounts it via the kubelet, which needs no SA permission.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["dockerhub-push"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bamboo-agent-kaniko
  namespace: {{ .Values.rbac.namespace }}
  labels:
    {{- include "bamboo-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: bamboo-agent
    namespace: {{ .Values.rbac.namespace }}
roleRef:
  kind: Role
  name: bamboo-agent-kaniko
  apiGroup: rbac.authorization.k8s.io
