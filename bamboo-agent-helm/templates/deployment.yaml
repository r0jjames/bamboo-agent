{{- if not .Values.image.tag }}
{{- fail "image.tag is required — set it to the pushed git-sha (--set image.tag=<sha>)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bamboo-agent
  namespace: {{ .Values.rbac.namespace }}
  labels:
    {{- include "bamboo-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Single-node lab: the node can't fit two agent pods plus Bamboo at once, so
  # replace the old pod before starting the new one (no rolling surge).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bamboo-agent.name" . }}
  template:
    metadata:
      labels:
        {{- include "bamboo-agent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: bamboo-agent
      initContainers:
        # Seed the custom capability into the agent home (a fresh emptyDir) before
        # the agent starts, using the image's shipped helper, which writes
        # $BAMBOO_AGENT_HOME/bin/bamboo-capabilities.properties. Runs as root so it
        # can create the dir; the main container's entrypoint chowns the home tree
        # to the agent user on startup.
        - name: seed-capabilities
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
          command: ["/bamboo-update-capability.sh"]
          args: ["agent.role", {{ .Values.capabilities.role | quote }}]
          env:
            - name: BAMBOO_AGENT_HOME
              value: /var/atlassian/application-data/bamboo-agent
          volumeMounts:
            - name: agent-home
              mountPath: /var/atlassian/application-data/bamboo-agent
      containers:
        # Forward this pod's localhost:54663 to the real broker on the server
        # pod. The server advertises ssl://localhost:54663 to agents (a forge-lab
        # choice for the host agent's port-forward); this makes that advertised
        # URL resolve correctly from inside the cluster too. Raw TCP passthrough,
        # so the agent's TLS session terminates at the broker, not here.
        - name: broker-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["socat"]
          args:
            - "TCP-LISTEN:{{ .Values.bamboo.broker.port }},fork,reuseaddr"
            - "TCP:{{ .Values.bamboo.broker.host }}:{{ .Values.bamboo.broker.port }}"
          resources:
            requests:
              cpu: "50m"
              memory: 32Mi
            limits:
              cpu: "100m"
              memory: 64Mi
        - name: bamboo-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Entrypoint appends /agentServer and registers the remote agent.
            - name: BAMBOO_SERVER
              value: {{ .Values.bamboo.server | quote }}
            - name: SECURITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokenSecret.name }}
                  key: {{ .Values.tokenSecret.key }}
            - name: BAMBOO_AGENT_HOME
              value: /var/atlassian/application-data/bamboo-agent
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: agent-home
              mountPath: /var/atlassian/application-data/bamboo-agent
      volumes:
        - name: agent-home
          emptyDir: {}
