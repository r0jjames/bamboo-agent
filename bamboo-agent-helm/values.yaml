image:
  repository: docker.io/rojcarranza/bamboo-agent
  # Semver, matching bamboo-agent-deployment/VERSION. Bump both together to
  # release. Override at install with --set image.tag=<x.y.z>.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

bamboo:
  # In-cluster service. The image entrypoint appends /agentServer automatically.
  # No broker override is set: the agent runs in-cluster, so the broker URL the
  # server advertises (bamboo-0.bamboo.ci.svc.cluster.local:54663) is reachable
  # directly — unlike the off-cluster host agent, which needs a localhost
  # override + port-forward.
  server: "http://bamboo.ci.svc.cluster.local:8085"

# Custom capability seeded into the agent at startup so CI/image-build plans
# (requirement agent.role=ci) schedule here, and multipass plans do not.
capabilities:
  role: ci

# Existing secret created by forge-lab's `make bamboo-secrets`.
tokenSecret:
  name: bamboo-agent-token
  key: security-token

rbac:
  # ns the agent may create kaniko Jobs in.
  namespace: ci

resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
