image:
  repository: docker.io/rojcarranza/bamboo-agent
  # Semver, matching bamboo-agent-deployment/VERSION. Bump both together to
  # release. Override at install with --set image.tag=<x.y.z>.
  tag: "0.1.1"
  pullPolicy: IfNotPresent

bamboo:
  # In-cluster Bamboo Service (port 80 -> pod 8085). The image entrypoint
  # appends /agentServer automatically.
  server: "http://bamboo.ci.svc.cluster.local"
  # forge-lab tunes the server to advertise the broker as ssl://localhost:54663
  # (for the host agent's port-forward). An in-cluster pod can't use that, so a
  # socat sidecar forwards this pod's localhost:54663 to the real broker on the
  # server pod. TLS stays end-to-end to the broker (raw TCP passthrough), and
  # verifyHostName=false is already in the advertised URL. Non-invasive: no
  # forge-lab or host-agent change.
  broker:
    host: "bamboo-0.bamboo.ci.svc.cluster.local"
    port: 54663

# Custom capability seeded into the agent at startup so CI/image-build plans
# (requirement agent.role=ci) schedule here, and multipass plans do not.
capabilities:
  role: ci

# Existing secret created by forge-lab's `make bamboo-secrets`.
tokenSecret:
  name: bamboo-agent-token
  key: security-token

rbac:
  # ns the agent may create kaniko Jobs in.
  namespace: ci

resources:
  requests:
    cpu: "250m"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
